# ---------------------------------------------------------------------------
# Cromwell backend config for the lift-and-shift WDL port.
# Run with:  java -Dconfig.file=wdl/cromwell.local.conf -jar cromwell.jar \
#                 run wdl/lembeddingscellprofileling.wdl -i wdl/inputs.json
#
# This reproduces three Nextflow behaviours that live in nextflow.config, not in
# the process definitions, so they can't be expressed in the WDL itself:
#   1. publishDir            -> final_workflow_outputs_dir
#   2. docker volume mounts  -> Local backend submit-docker (CellProfiler step)
#   3. process maxForks      -> per-backend concurrent-job-limit
# ---------------------------------------------------------------------------

include required(classpath("application"))

# 1. publishDir equivalent: copy declared workflow outputs (the *.html) out of
#    the cromwell-executions sandbox into a stable directory.
final_workflow_outputs_dir = "results"
final_workflow_outputs_dir_metadata = true
use_relative_output_paths = false

backend {
  default = "Local"

  providers {

    # Default host backend: QC_MULT, QC_REPORT_ANNOT, EMBEDDINGS_EXTRACTION run
    # here (no `docker` runtime attribute -> executed directly on the host shell,
    # using the host conda env / scripts / GPU, exactly like the Nextflow
    # `local` executor).
    #
    # NOTE on maxForks: Cromwell concurrency is per-backend, not per-task. The
    # Nextflow QC_MULT and EMBEDDINGS_EXTRACTION use maxForks 1 (GPU / heavy
    # single-host jobs). The safe lift-and-shift is to cap the whole host backend
    # at 1 concurrent job. If you want QC_REPORT_ANNOT (maxForks 20) to run wider,
    # define a second backend and route it with a `backend:` runtime attribute.
    Local {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        concurrent-job-limit = 1

        runtime-attributes = """
          String? docker
          String? docker_user
        """

        # When a task HAS a `docker` runtime attribute (CELLPROFILER_ILLUM), start
        # the container with the same mounts as the Nextflow `docker` profile:
        #   -v ${params.NAS_folder}:/mnt/s3 -v /mnt/s3_results:/mnt/s3out -v ~/.aws:/root/.aws
        # Adjust the NAS path / home dir below to match your host.
        submit-docker = """
          docker run \
            --rm -i \
            --entrypoint /bin/bash \
            -v ${cwd}:${docker_cwd} \
            -v /mnt/ugreen_nas_v1/clientsdata:/mnt/s3 \
            -v /mnt/s3_results:/mnt/s3out \
            -v ${HOME}/.aws:/root/.aws \
            ${docker} ${script}
        """

        # Tasks WITHOUT a docker attribute run on the host shell:
        submit = "/usr/bin/env bash ${script}"
        run-in-background = true
      }
    }
  }
}
