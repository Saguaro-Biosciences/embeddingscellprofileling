name: Build pipeline container

# Builds docker/Dockerfile and pushes it to GHCR as
# ghcr.io/saguaro-biosciences/lembeddingscellprofileling:<manifest version> (+ :latest on master).
on:
  push:
    branches: [master]
    paths: ["docker/**", ".github/workflows/docker.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image is ~9.5 GB (CUDA torch + baked model weights); the default runner disk is too small
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Read pipeline version
        id: version
        run: echo "version=$(grep -oP "^\s*version\s*=\s*'\K[^']+" nextflow.config)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/saguaro-biosciences/lembeddingscellprofileling:${{ steps.version.outputs.version }}
            ${{ github.ref == 'refs/heads/master' && 'ghcr.io/saguaro-biosciences/lembeddingscellprofileling:latest' || '' }}
