repository_type: pipeline

nf_core_version: 4.0.2

lint:
  files_unchanged:
    - .prettierignore
    - CODE_OF_CONDUCT.md
    - assets/nf-core-lembeddingscellprofileling_logo_light.png
    - docs/images/nf-core-lembeddingscellprofileling_logo_light.png
    - docs/images/nf-core-lembeddingscellprofileling_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - assets/sendmail_template.txt
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config: false
  files_exist:
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-lembeddingscellprofileling_logo_light.png
    - docs/images/nf-core-lembeddingscellprofileling_logo_light.png
    - docs/images/nf-core-lembeddingscellprofileling_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - assets/multiqc_config.yml

template:
  org: Saguaro-Biosciences
  name: lembeddingscellprofileling
  description: Embedding based cell profilling
  author: Diego Camacho
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - email
  is_nfcore: false
